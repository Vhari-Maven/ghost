<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="camsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#67e8f9"/>
      <stop offset="50%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0e7490"/>
    </linearGradient>
  </defs>

  <!-- Outer glow -->
  <circle cx="16" cy="13" r="12" fill="#06b6d4" opacity="0.1"/>

  <!-- Pan/tilt dome head -->
  <circle cx="16" cy="13" r="10" fill="#06b6d4" opacity="0.2"/>
  <circle cx="16" cy="13" r="10" fill="none" stroke="url(#camsGrad)" stroke-width="1.5"/>

  <!-- Lens rings -->
  <circle cx="16" cy="13" r="5.5" fill="#0e7490" opacity="0.6"/>
  <circle cx="16" cy="13" r="5.5" fill="none" stroke="#67e8f9" stroke-width="1.2"/>
  <circle cx="16" cy="13" r="2.5" fill="none" stroke="#67e8f9" stroke-width="1"/>
  <circle cx="17" cy="12" r="0.9" fill="#e5fbff"/>

  <!-- Status LED -->
  <circle cx="16" cy="5.5" r="0.8" fill="#67e8f9"/>

  <!-- Base -->
  <path d="M10 25 Q16 21 22 25 L23 29 H9 Z" fill="#06b6d4" opacity="0.2"/>
  <path d="M10 25 Q16 21 22 25 L23 29 H9 Z" fill="none" stroke="url(#camsGrad)" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Scan lines -->
  <line x1="8" y1="10" x2="11" y2="10" stroke="#67e8f9" stroke-width="0.5" opacity="0.5"/>
  <line x1="21" y1="16" x2="24" y2="16" stroke="#67e8f9" stroke-width="0.5" opacity="0.5"/>
</svg>
