<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="analyticsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#67e8f9"/>
      <stop offset="50%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0e7490"/>
    </linearGradient>
  </defs>

  <!-- Outer glow -->
  <rect x="1" y="2" width="30" height="28" rx="3" fill="#06b6d4" opacity="0.1"/>

  <!-- Chart frame -->
  <rect x="2" y="3" width="28" height="26" rx="2" fill="#06b6d4" opacity="0.15"/>
  <rect x="2" y="3" width="28" height="26" rx="2" fill="none" stroke="url(#analyticsGrad)" stroke-width="1.5"/>

  <!-- Axes -->
  <path d="M6 7 L6 25 L27 25" fill="none" stroke="#0e7490" stroke-width="1"/>

  <!-- Bars -->
  <rect x="8" y="18" width="3.5" height="7" fill="url(#analyticsGrad)" opacity="0.5"/>
  <rect x="8" y="18" width="3.5" height="7" fill="none" stroke="#67e8f9" stroke-width="0.8"/>
  <rect x="13.5" y="14" width="3.5" height="11" fill="url(#analyticsGrad)" opacity="0.5"/>
  <rect x="13.5" y="14" width="3.5" height="11" fill="none" stroke="#67e8f9" stroke-width="0.8"/>
  <rect x="19" y="16" width="3.5" height="9" fill="url(#analyticsGrad)" opacity="0.5"/>
  <rect x="19" y="16" width="3.5" height="9" fill="none" stroke="#67e8f9" stroke-width="0.8"/>

  <!-- Trend line rising over the bars -->
  <path d="M8 16 L15 11 L20 13 L26 8" fill="none" stroke="#67e8f9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="15" cy="11" r="1.2" fill="#67e8f9"/>
  <circle cx="20" cy="13" r="1.2" fill="#67e8f9"/>
  <circle cx="26" cy="8" r="1.8" fill="#0e7490"/>
  <circle cx="26" cy="8" r="1.8" fill="none" stroke="#67e8f9" stroke-width="1"/>

  <!-- Scan lines -->
  <g opacity="0.2">
    <line x1="2" y1="11" x2="30" y2="11" stroke="#67e8f9" stroke-width="0.5"/>
    <line x1="2" y1="17" x2="30" y2="17" stroke="#67e8f9" stroke-width="0.5"/>
    <line x1="2" y1="23" x2="30" y2="23" stroke="#67e8f9" stroke-width="0.5"/>
  </g>
</svg>
